name: Brutal Fist build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build

  schwarzerblitz-native:
    runs-on: windows-latest
    steps:
      - name: Checkout Brutal Fist
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout Schwarzerblitz engine source
        uses: actions/checkout@v4
        with:
          repository: mhvnsnt/SchwarzerblitzEngine
          path: vendor/SchwarzerblitzEngine
          fetch-depth: 1
      - name: Checkout Bannon source
        uses: actions/checkout@v4
        with:
          repository: mhvnsnt/Bannon
          path: BannonSource
          fetch-depth: 1
      - name: Verify native source checkout
        shell: pwsh
        run: |
          if (-not (Test-Path 'vendor/SchwarzerblitzEngine')) { throw 'SchwarzerblitzEngine source is missing' }
          if (-not (Test-Path 'BannonSource')) { throw 'Bannon source is missing' }
      - name: Locate Visual Studio
        uses: microsoft/setup-msbuild@v2
      - name: Build Schwarzerblitz native engine
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path vendor/SchwarzerblitzEngine -Filter '*.sln' -Recurse | Select-Object -First 1
          if (-not $sln) { throw 'Schwarzerblitz solution not found' }
          msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=Win32
