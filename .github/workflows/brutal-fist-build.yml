name: Brutal Fist build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Enforce Bannon GLB roster boundary
        run: bun run bannon:verify
      - run: bun run build

  schwarzerblitz-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify native source checkout
        shell: pwsh
        run: |
          if (-not (Test-Path 'vendor/SchwarzerblitzEngine')) { throw 'SchwarzerblitzEngine submodule is missing' }
          if (-not (Test-Path 'BannonSource')) { throw 'BannonSource submodule is missing' }
      - name: Locate Visual Studio
        uses: microsoft/setup-msbuild@v2
      - name: Build Schwarzerblitz native engine
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Path vendor/SchwarzerblitzEngine -Filter '*.sln' -Recurse | Select-Object -First 1
          if (-not $sln) { throw 'Schwarzerblitz solution not found' }
          msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=Win32
